<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="referrer" content="no-referrer">
  <title>创建订单 · 超频侧载</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="donate">
  <div class="site-shell compact-shell">
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="超频侧载首页"><span class="wordmark-mark" aria-hidden="true">OC</span><span>超频侧载</span></a>
      <a class="topbar-link" href="register.html">已有注册链接 <span aria-hidden="true">→</span></a>
    </header>

    <main class="flow-main">
      <div class="flow-heading">
        <div class="eyebrow">DONATION ORDER / 03</div>
        <h1>创建订单</h1>
        <p>确认到账后，服务器会自动把一次性注册链接发送到订单邮箱。</p>
      </div>

      <section class="donate-layout">
        <form class="form-card" data-donate-form novalidate>
          <div class="field-row"><label class="field"><span>QQ 号 <b>*</b></span><input name="qq" inputmode="numeric" maxlength="32" required placeholder="用于联系你"></label><label class="field"><span>QQ 昵称 <b>*</b></span><input name="nickname" maxlength="60" required placeholder="你的昵称"></label></div>
          <label class="field"><span>接收注册链接的邮箱 <b>*</b></span><input name="email" type="email" autocomplete="email" maxlength="254" required placeholder="name@example.com"></label>
          <button class="button button-primary button-wide" type="submit"><span data-order-label>创建订单</span><span aria-hidden="true">→</span></button>
          <div class="form-status" data-donate-status role="status" aria-live="polite"></div>
        </form>

        <aside class="payment-card" data-payment-panel>
          <div class="payment-meta"><span class="panel-label">CURRENT CONFIG</span><span class="payment-state" data-payment-state>读取中</span></div>
          <div class="amount-line"><span>建议金额</span><strong data-amount>--</strong></div>
          <p class="announcement" data-announcement>正在读取服务端公告</p>
          <div class="payment-image-wrap" data-payment-image-wrap hidden><img data-payment-image alt="服务端收款图像"></div>
          <div class="payment-unavailable" data-payment-unavailable>服务暂不可用</div>
          <div class="order-result" data-order-result hidden>
            <div class="order-result-head"><span class="panel-label">ORDER STATUS</span><span class="live-pill"><i></i>自动刷新</span></div>
            <strong data-order-title>等待付款</strong>
            <p data-order-copy>付款确认后，注册链接会自动发送到订单邮箱。</p>
          </div>
        </aside>
      </section>
    </main>
    <footer class="footer"><a href="index.html">返回首页</a><span>金额与收款信息以服务端配置为准</span></footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
